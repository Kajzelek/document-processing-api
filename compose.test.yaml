services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: document_processing_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: integration_test_password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U test_user -d document_processing_test
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: document_processing_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: integration_test_password
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m app.db.init_db && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8080
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s