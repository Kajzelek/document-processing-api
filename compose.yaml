services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: document_processing
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d document_processing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: