name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v

      - name: Build Docker image
        run: docker build -t document-processing-api:ci .

      - name: Start integration environment
        run: >
          docker compose
          -p document-processing-test
          -f compose.test.yaml
          up --build -d --wait --wait-timeout 120

      - name: Run integration tests
        run: python -m pytest integration_tests -v

      - name: Show container logs on failure
        if: failure()
        run: >
          docker compose
          -p document-processing-test
          -f compose.test.yaml
          logs --no-color

      - name: Clean up integration environment
        if: always()
        run: >
          docker compose
          -p document-processing-test
          -f compose.test.yaml
          down -v